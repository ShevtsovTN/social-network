# Режим разработки. Подхватывается автоматически командой `docker compose up`.
# Для нагрузочных замеров НЕ используется: запускайте `make bench-up`.

x-xdebug: &xdebug
  # off по умолчанию; `make debug-on` включает режим debug.
  XDEBUG_MODE: ${XDEBUG_MODE:-off}

services:
  php-native:
    volumes:
      - .:/app
    environment:
      <<: *xdebug
    extra_hosts:
      - "host.docker.internal:host-gateway"

  php-symfony:
    volumes:
      - .:/app
    environment:
      <<: *xdebug
      # В dev Symfony пересобирает контейнер при изменении конфигов; bench остаётся на prod.
      APP_ENV: dev
      APP_DEBUG: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Длинный таймаут nginx, чтобы запрос не обрывался на точке останова.
  nginx-native:
    volumes:
      - ./social-network-docker/nginx/dev/fastcgi-timeouts.conf:/etc/nginx/snippets/fastcgi-timeouts.conf:ro

  nginx-symfony:
    volumes:
      - ./social-network-docker/nginx/dev/fastcgi-timeouts.conf:/etc/nginx/snippets/fastcgi-timeouts.conf:ro

  # Frontend: статика и прокси в оба приложения (/api/native/, /api/symfony/).
  # Только dev: в docker-compose.yaml (bench) его нет, замеры он не затрагивает.
  nginx-frontend:
    image: nginx:1.27.5-alpine
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./social-network-docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx-native
      - nginx-symfony
    networks:
      - backend
