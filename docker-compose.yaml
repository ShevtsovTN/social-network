name: social-network

# Базовый файл: без bind mount, код берётся из образа (target bench).
# docker-compose.override.yaml подхватывается автоматически и добавляет
# bind mount для разработки. Для замеров запускать с `-f docker-compose.yaml`
# (см. `make bench-up`), чтобы bind mount не искажал результаты.

x-php-app: &php-app
  image: social-network-php:${PHP_BUILD_TARGET:-dev}
  build:
    context: .
    dockerfile: social-network-docker/php/Dockerfile
    target: ${PHP_BUILD_TARGET:-dev}
  environment: &php-env
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ${POSTGRES_DB}
    DB_USER: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
  depends_on:
    postgres:
      condition: service_healthy
  # Одинаковые лимиты для обоих приложений: честное нагрузочное сравнение.
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 512M
  networks:
    - backend

services:
  postgres:
    image: postgres:17.10-alpine
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Выполняется один раз, при инициализации пустого тома.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - ./social-network-docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # --- Приложение на чистом PHP ---
  php-native:
    <<: *php-app
    working_dir: /app/apps/native

  nginx-native:
    image: social-network-nginx-native
    build:
      context: ./social-network-docker/nginx
      dockerfile: Dockerfile
      args:
        SITE_CONFIG: native.conf
    ports:
      - "${NATIVE_PORT:-8081}:80"
    depends_on:
      - php-native
    networks:
      - backend

  # --- Приложение на Symfony ---
  php-symfony:
    <<: *php-app
    working_dir: /app/apps/symfony
    environment:
      <<: *php-env
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${SYMFONY_APP_SECRET}

  nginx-symfony:
    image: social-network-nginx-symfony
    build:
      context: ./social-network-docker/nginx
      dockerfile: Dockerfile
      args:
        SITE_CONFIG: symfony.conf
    ports:
      - "${SYMFONY_PORT:-8082}:80"
    depends_on:
      - php-symfony
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
