# Redis для ДЗ «Лента постов»: кэш ленты друзей и очередь событий fan-out (Redis Streams).
# Redis здесь не источник истины: все данные восстанавливаются из PostgreSQL.
# Параметры, зависящие от лимита контейнера (maxmemory) и секретов (requirepass), передаются в docker-compose.yaml.

bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 60

# Без персистентности: ни RDB, ни AOF. Если Redis потерял всё, лент в кэше тоже нет, они пересоберутся
# из PostgreSQL при чтении, а потерянные необработанные события стрима уже ничего не ломают
# (остаётся только допущение «процесс упал между фиксацией в PostgreSQL и XADD», см. CLAUDE.md).
save ""
appendonly no

# Вытесняются только ключи с TTL (ленты и тела постов). Стрим создаётся без TTL и не вытесняется;
# его размер ограничивает приложение (XADD ... MAXLEN ~).
maxmemory-policy volatile-lru
maxmemory-samples 10

# Только один логический db: префикс ключей отделяет приложения друг от друга.
databases 1
