# Балансировка чтения между репликами PostgreSQL. Приложения ходят сюда за GET /user/get/{id} и GET /user/search
# (DB_READ_HOST), запись и логин идут напрямую на primary. HAProxy не разбирает SQL, он раскладывает TCP-соединения.
#
# Соединения php-fpm постоянные (PDO::ATTR_PERSISTENT): реплика выбирается один раз, когда воркер открывает
# соединение, а не на каждый запрос. Поэтому после перезапуска php равномерность проверяется по метрикам
# haproxy и pg_stat_database (см. отчёт).

global
    maxconn 4096

defaults
    mode tcp
    # Постоянные соединения живут долго: таймаут простоя большой, keepalive отлавливает оборванные.
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    option clitcpka
    option srvtcpka
    # Адрес реплики, которая не поднялась к старту haproxy, не ломает запуск: сервер помечается недоступным.
    default-server init-addr last,libc,none

frontend postgres_read
    bind *:5432
    default_backend postgres_replicas

backend postgres_replicas
    balance roundrobin
    # Проверка по протоколу PostgreSQL: сервер должен ответить на startup-пакет. Упавшая реплика исключается
    # из ротации через fall × inter = 4 с, вернувшаяся включается через rise × inter = 4 с.
    option pgsql-check user haproxy
    server replica1 postgres-replica-1:5432 check inter 2s fall 2 rise 2
    server replica2 postgres-replica-2:5432 check inter 2s fall 2 rise 2

# Статистика и метрики Prometheus (профиль мониторинга будет собирать /metrics).
frontend stats
    mode http
    bind *:8404
    timeout client 30s
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
