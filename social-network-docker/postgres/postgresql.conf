# Фиксированные параметры PostgreSQL для воспроизводимых нагрузочных замеров.
# Подключается через `-c config_file=...` в docker-compose.yaml.
listen_addresses = '*'
max_connections = 200

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB

timezone = 'UTC'
log_timezone = 'UTC'

# --- Репликация ---
# Общий файл для primary и standby: на standby эти параметры безвредны, а после promote узел
# сразу готов быть primary и отдавать WAL остальным.
wal_level = replica
max_wal_senders = 10
# Запас WAL на primary для отставшей реплики (слоты репликации не используются: при failover их
# пришлось бы пересоздавать на новом мастере). Реплика, отставшая больше, чем на этот объём, пересоздаётся заново.
wal_keep_size = 1GB
hot_standby = on
# Нужен pg_rewind, чтобы вернуть бывший мастер в кластер репликой после аварии.
wal_log_hints = on
