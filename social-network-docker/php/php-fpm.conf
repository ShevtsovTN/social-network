; Пул php-fpm, одинаковый для обоих приложений.
; static: фиксированное число воркеров, чтобы результаты замеров были стабильными.
[www]
user = www-data
group = www-data
listen = 9000
clear_env = no
catch_workers_output = yes

pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}

request_terminate_timeout = 30s
