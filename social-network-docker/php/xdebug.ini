; Xdebug, только target dev. По умолчанию выключен (нулевые накладные расходы).
; Режим переопределяется переменной окружения XDEBUG_MODE (см. `make debug-on`).
xdebug.mode = off

; Отладка стартует по триггеру: cookie XDEBUG_SESSION, параметр XDEBUG_TRIGGER=1
; в запросе (удобно для Postman) или расширение браузера.
xdebug.start_with_request = trigger

; IDE слушает порт 9003 на хосте.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = false

xdebug.log_level = 0
