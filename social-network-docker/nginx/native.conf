# Код приложения в nginx не монтируется: он только проксирует в php-fpm.
# Путь в SCRIPT_FILENAME указывает на файл внутри php-контейнера.
server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location / {
        include fastcgi_params;
        fastcgi_pass php-native:9000;
        fastcgi_param SCRIPT_FILENAME /app/apps/native/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/apps/native/public;
        fastcgi_read_timeout 30s;
    }
}
