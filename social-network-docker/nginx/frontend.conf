# Dev-only: статика frontend и прокси в оба приложения под одним origin (без CORS).
# Не участвует в нагрузочных замерах (см. docker-compose.override.yaml).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    location /api/native/ {
        proxy_pass http://nginx-native:80/;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/symfony/ {
        proxy_pass http://nginx-symfony:80/;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
}
