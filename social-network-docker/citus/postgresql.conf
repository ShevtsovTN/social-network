# Конфиг узлов кластера Citus (ДЗ «Шардинг диалогов»): один файл на координатор и все воркеры.
# Лимиты CPU и памяти задаются в compose отдельно для координатора и для воркеров (DIALOGS_*).
listen_addresses = '*'
max_connections = 200
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
timezone = 'UTC'
log_timezone = 'UTC'

shared_preload_libraries = 'citus'

# Решардинг без даунтайма: Citus переносит шарды логической репликацией, поэтому запись в переносимый шард
# не останавливается на время копирования. Для этого нужны wal_level = logical и запас слотов, отправителей WAL
# и фоновых процессов (подписки на узле-приёмнике и фоновые задачи ребалансировки).
wal_level = logical
max_replication_slots = 20
max_wal_senders = 20
max_logical_replication_workers = 8
max_worker_processes = 16
